# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Report internal coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_dir="$(mktemp -d)"
          trap 'rm -rf "$coverage_dir"' EXIT
          {
            echo "## Core test coverage"
            echo
            echo "| Package | Statement coverage |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r package; do
            profile="$coverage_dir/$(echo "$package" | tr '/' '_').out"
            go test "-coverprofile=$profile" "$package"
            coverage="$(go tool cover "-func=$profile" | awk '/^total:/ {print $3}')"
            echo "| \`$package\` | $coverage |" >> "$GITHUB_STEP_SUMMARY"
          done < <(go list ./internal/...)
